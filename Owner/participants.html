<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participants — Infinity Scrims Owner</title>
 <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body data-page="participants">
  <div class="app">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div id="header-mount"></div>
      <div class="page-content" data-skeleton="off">
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> &gt; <span class="current">Participants</span></div>
        <h1 class="page-title">Participants</h1>
        <p class="page-sub">View booked teams for a scrim.</p>

        <div class="card" style="margin-bottom:20px;">
          <div class="field" style="margin-bottom:0;">
            <label>Select Scrim</label>
            <select id="scrimSelect"><option>Loading scrims...</option></select>
          </div>
        </div>

        <div id="slotSummary" style="display:none; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:16px;">
          <div style="font-size:13px;"><b id="ssBooked">0</b> / <span id="ssTotal">0</span> slots booked &nbsp;·&nbsp; <span id="ssRemaining" style="color:var(--success); font-weight:700;">0</span> remaining</div>
          <div style="font-size:11px; color:var(--text-muted);">Auto-refreshes every 15s</div>
        </div>

        <div class="table-wrap card">
          <table>
<thead><tr><th>Slot</th><th>Team</th><th>Captain</th><th>Contact</th><th>Amount</th><th>Booking</th><th>Payment</th><th>Winner</th></tr></thead>
            <tbody id="partBody"><tr><td colspan="7"><div class="empty-state">Select a scrim above</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="bottomnav-mount"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/owner-common.js"></script>
  <script>
    let scrimsCache = [];
    let currentScrimId = null;
    let pollTimer = null;

    async function loadScrims() {
      try {
        const data = await Api.get('/scrims/my.php');
        scrimsCache = data.scrims;
        const select = document.getElementById('scrimSelect');
        select.innerHTML = data.scrims.map(s => `<option value="${s.id}">${escapeHtml(s.title)} (${new Date(s.match_at).toLocaleDateString()})</option>`).join('');
        select.addEventListener('change', () => { currentScrimId = select.value; loadParticipants(currentScrimId); });
        const preselect = new URLSearchParams(location.search).get('scrim_id');
        if (preselect) select.value = preselect;
        if (select.value) { currentScrimId = select.value; loadParticipants(currentScrimId); }
      } catch (err) { toast(err.message, 'error'); }
    }

    async function loadParticipants(scrimId) {
      document.getElementById('partBody').innerHTML = `<tr><td colspan="7"><div class="skeleton skeleton-line"></div></td></tr>`;
      try {
        const data = await Api.get('/scrims/participants.php?scrim_id=' + scrimId);
        document.getElementById('partBody').innerHTML = data.participants.length ? data.participants.map(p => `
          <tr>
            <td><b>#${p.slot_number}</b></td>
<td>
              <div style="display:flex; align-items:center; gap:8px;">
                ${p.logo_url
                  ? `<img src="${p.logo_url}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
                  : `<div style="width:26px;height:26px;border-radius:50%;background:var(--surface-alt);flex-shrink:0;"></div>`}
                <span>${escapeHtml(p.team_name)} ${p.tag ? '<span style="color:var(--text-muted);">#'+escapeHtml(p.tag)+'</span>':''}</span>
${p.logo_url ? `<a href="${p.logo_url}" download="${escapeHtml(p.team_name)}-logo.png" class="btn btn-sm btn-outline" style="padding:5px 12px; font-weight:600; white-space:nowrap;">⬇ Download</a>` : ''}              </div>
            </td>
                        <td>${escapeHtml(p.captain)}</td>
            <td style="font-size:12px;">${escapeHtml(p.email)}<br>${escapeHtml(p.phone || '—')}</td>
            <td>${p.amount_txt}</td>
            <td><span class="badge ${p.booking_status==='confirmed'?'badge-success':'badge-warning'}">${p.booking_status}</span></td>
<td>${p.payment_status ? `<a href="${p.screenshot_url}" target="_blank" class="badge ${p.payment_status==='approved'?'badge-success':'badge-warning'}">${p.payment_status}</a>` : '<span class="badge badge-muted">no proof</span>'}</td>
            <td>
              ${p.winner_position
                ? `<span class="badge badge-success">${p.winner_position === 1 ? '🥇 Top 1' : p.winner_position === 2 ? '🥈 Top 2' : '🥉 Top 3'} · ${p.prize_won_txt}</span>
                   <button class="btn btn-sm btn-outline" style="margin-top:4px;" onclick="unmarkWinner(${p.team_id})">Undo</button>`
                : `<select class="btn btn-sm btn-outline" style="padding:4px 8px;" onchange="if(this.value) markWinner(${p.team_id}, this.value, this)">
                    <option value="">Mark as…</option>
                    <option value="1">🥇 Top 1</option>
                    <option value="2">🥈 Top 2</option>
                    <option value="3">🥉 Top 3</option>
                  </select>`}
            </td>
          </tr>
        `).join('') : `<tr><td colspan="8"><div class="empty-state">No participants for this scrim yet</div></td></tr>`;

        const scrim = scrimsCache.find(s => String(s.id) === String(scrimId));
        if (scrim) {
          const booked = data.participants.filter(p => p.booking_status === 'confirmed').length;
          document.getElementById('slotSummary').style.display = 'flex';
          document.getElementById('ssBooked').textContent = booked;
          document.getElementById('ssTotal').textContent = scrim.total_slots;
          document.getElementById('ssRemaining').textContent = scrim.total_slots - booked;
        }

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(() => { if (currentScrimId === scrimId) loadParticipants(scrimId); }, 15000);
      } catch (err) { toast(err.message, 'error'); }
    }
async function markWinner(teamId, position, selectEl) {
      if (!currentScrimId) return;
      const label = position === '1' ? 'Top 1' : position === '2' ? 'Top 2' : 'Top 3';
      if (!confirm(`Mark this team as ${label}? Their prize will be auto-assigned from the scrim's prize pool.`)) {
        selectEl.value = '';
        return;
      }
      try {
        const data = await Api.post('/scrims/mark_winner.php', { scrim_id: currentScrimId, team_id: teamId, position: parseInt(position) });
        toast(data.message || 'Winner marked.', 'success');
        loadParticipants(currentScrimId);
      } catch (err) {
        toast(err.message, 'error');
        selectEl.value = '';
      }
    }

    async function unmarkWinner(teamId) {
      if (!currentScrimId) return;
      if (!confirm("Remove this team's winner mark?")) return;
      try {
        await Api.post('/scrims/unmark_winner.php', { scrim_id: currentScrimId, team_id: teamId });
        toast('Winner mark removed.', 'success');
        loadParticipants(currentScrimId);
      } catch (err) { toast(err.message, 'error'); }
    }

    loadScrims();
  </script>
</body>
</html>
