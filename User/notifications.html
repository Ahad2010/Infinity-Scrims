<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Infinity Scrims</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.webp">
</head>
<body data-page="notifications">
  <div class="app">
    <div id="sidebar-mount"></div>
    <div class="main">
      <div id="header-mount"></div>
      <div class="page-content">
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> &gt; <span class="current">Notifications</span></div>
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <h1 class="page-title">Notifications</h1>
            <p class="page-sub">Stay updated with all the important activities.</p>
          </div>
          <button class="btn btn-outline" id="markReadBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Mark all as read
          </button>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:18px 0;">
          <div style="display:flex; gap:8px; flex-wrap:wrap;" id="notifTabs">
            <button class="btn btn-sm" data-filter="all">All</button>
            <button class="btn btn-outline btn-sm" data-filter="unread">Unread</button>
            <button class="btn btn-outline btn-sm" data-filter="booking">Bookings</button>
            <button class="btn btn-outline btn-sm" data-filter="payment">Payments</button>
            <button class="btn btn-outline btn-sm" data-filter="team">Teams</button>
            <button class="btn btn-outline btn-sm" data-filter="system">System</button>
          </div>
        </div>

        <div class="card" id="notifList"></div>

        <div style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:16px;" id="notifFooter"></div>
      </div>
    </div>
  </div>
  <div id="bottomnav-mount"></div>

  <div id="support-widget-mount"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/demo-seed.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/support-widget.js"></script>
  <script>
    /** Real endpoint: GET /notifications.php -> {notifications, unread}
     *  Mark read: POST /notifications.php {id?} (no id = mark all read) */
    let NOTIFS = [];

    async function loadNotifications() {
      document.getElementById('notifList').innerHTML = skeleton(4);
      try {
        const data = await Api.get('/notifications.php');
        NOTIFS = data.notifications || [];
        render(currentFilter());
        document.getElementById('notifFooter').textContent = NOTIFS.length ? "You've reached the end of notifications ✓" : '';
      } catch (err) {
        document.getElementById('notifList').innerHTML = `<div class="empty-state">${escapeHtml(err.message || 'Could not load notifications.')}</div>`;
      }
    }

    function currentFilter() {
      const active = document.querySelector('#notifTabs .btn:not(.btn-outline)');
      return active ? active.dataset.filter : 'all';
    }

    function render(filter = 'all') {
      const list = NOTIFS.filter(n => filter === 'all' ? true : filter === 'unread' ? !n.is_read : n.type === filter);
      document.getElementById('notifList').innerHTML = list.map(n => {
        const ai = activityIcon(n.type);
        return `
        <div class="notif-item" data-id="${n.id}">
          <div class="row-icon badge ${ai.cls}" style="width:40px;height:40px;">${ai.icon}</div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; gap:10px;">
              <b style="font-size:14px;">${escapeHtml(n.title)}</b>
              <span style="font-size:11px; color:var(--text-muted); white-space:nowrap;">${n.ago}</span>
            </div>
            ${n.body ? `<div style="font-size:12px; color:var(--text-muted); margin:4px 0 10px; white-space:pre-line;">${escapeHtml(n.body)}</div>` : ''}
            ${n.link ? `<a href="${escapeHtml(n.link)}" class="btn btn-outline btn-sm" onclick="markOneRead(${n.id})">View</a>` : ''}
          </div>
          ${!n.is_read ? '<span class="unread-dot"></span>' : ''}
        </div>`;
      }).join('') || `<div class="empty-state">No notifications here.</div>`;
    }

    document.querySelectorAll('#notifTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#notifTabs button').forEach(b => b.className = 'btn btn-outline btn-sm');
        btn.className = 'btn btn-sm';
        render(btn.dataset.filter);
      });
    });

    async function markOneRead(id) {
      try { await Api.post('/notifications.php', { id }); } catch {}
    }

    document.getElementById('markReadBtn').addEventListener('click', async () => {
      try {
        await Api.post('/notifications.php', {});
        NOTIFS.forEach(n => n.is_read = 1);
        render(currentFilter());
        document.querySelectorAll('[data-notif-count]').forEach(el => el.style.display = 'none');
        toast('All notifications marked as read.', 'success');
      } catch (err) {
        toast(err.message || 'Could not mark as read.', 'error');
      }
    });

    loadNotifications();
  </script>
</body>
</html>
