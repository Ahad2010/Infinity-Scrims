<div class="topbar">
  <button class="hamburger" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>

  <a href="dashboard.html" class="topbar-logo">
    <img src="assets/img/logo-mark-dark.png" alt="Infinity Scrims">
    <span>Infinity Scrims</span>
  </a>

  <div class="topbar-right">
    <div class="icon-btn" id="notifBellBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot" data-notif-count style="display:none;"></span>
    </div>

    <div class="user-menu">
      <div class="user-chip dropdown-trigger" data-target="user-dropdown">
        <div class="avatar" data-user-initial>?</div>
        <div>
          <div class="name" data-user-name>...</div>
          <div class="role" data-user-role>...</div>
        </div>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:2px;"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="dropdown" id="user-dropdown">
        <a href="profile.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> View Profile</a>
        <a href="settings.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82"/></svg> Account Settings</a>
        <a href="settings.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Security</a>
        <div class="theme-toggle">
          <span>Appearance: <b data-theme-label></b></span>
          <div class="switch" onclick="Theme.toggle()"></div>
        </div>
        <hr>
        <button class="danger" data-action="logout"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="notif-drawer-overlay" id="notifDrawerOverlay"></div>
<div class="notif-drawer" id="notifDrawer" role="dialog" aria-label="Notifications">
  <div class="notif-drawer-head">
    <div>
      <h3>Notifications</h3>
      <p>Stay updated with all the important activities.</p>
    </div>
    <button class="notif-drawer-close" id="notifDrawerClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
 
  <div class="notif-drawer-actions">
    <button class="btn btn-outline btn-sm btn-block" id="notifMarkReadBtn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Mark all as read
    </button>
  </div>
  <div class="notif-drawer-body" id="notifDrawerBody"></div>
  <div class="notif-drawer-footer" id="notifDrawerFooter"></div>
</div>

<script>
  document.querySelectorAll('[data-theme-label]').forEach(el => {
    el.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Dark' : 'Light';
  });
</script>
